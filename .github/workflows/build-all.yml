name: Compilar Multiplataforma (iOS & Android)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-android:
    name: Compilar Android APK (Ubuntu + Gradle)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK (Release)
        run: |
          chmod +x gradlew
          GRADLE_ARGS=":androidApp:assembleRelease --stacktrace"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            IFS='.' read -r major minor patch <<< "$TAG_VER"
            V_CODE=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
            echo "Sincronizando APK con tag $TAG_VER (code: $V_CODE)"
            GRADLE_ARGS=":androidApp:assembleRelease -PappVersionName=$TAG_VER -PappVersionCode=$V_CODE --stacktrace"
          fi
          ./gradlew $GRADLE_ARGS

      - name: Subir artefacto APK (Android)
        uses: actions/upload-artifact@v4
        with:
          name: EnduLink-Android-APK
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Cancelar el resto de jobs si falla
        if: failure()
        uses: andymckay/cancel-action@0.4

  build-ios:
    name: Compilar iOS IPA (macOS + Xcode)
    runs-on: macos-15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version
          xcodebuild -version

      - name: Compilar XCFramework KMP Compartido (Solo ARM64 para dispositivo)
        run: |
          chmod +x gradlew
          ./gradlew :shared:assembleSharedAppReleaseXCFramework -PiosArm64Only=true --stacktrace

      - name: Sincronizar versión con Tag en Info.plist (si aplica)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          echo "Sincronizando iOS Info.plist con tag: $TAG_VER"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $TAG_VER" iosApp/iosApp/Info.plist || true

      - name: Generar proyecto Xcode con XcodeGen
        run: |
          cd iosApp
          xcodegen generate

      - name: Compilar EnduLink (Release ARM64 sin firma)
        run: |
          xcodebuild -project iosApp/EnduLink.xcodeproj \
            -scheme EnduLink \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            -parallelizeTargets \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=""

      - name: Empaquetar EnduLink-unsigned.ipa
        run: |
          rm -rf Payload EnduLink-unsigned.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/EnduLink.app Payload/
          zip -qry EnduLink-unsigned.ipa Payload
          ls -lh EnduLink-unsigned.ipa

      - name: Subir artefacto IPA (para Sideloadly / SideStore)
        uses: actions/upload-artifact@v4
        with:
          name: EnduLink-iOS-unsigned-ipa
          path: EnduLink-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Cancelar el resto de jobs si falla
        if: failure()
        uses: andymckay/cancel-action@0.4

  release:
    name: Publicar Release en GitHub (APK + IPA)
    needs: [ build-android, build-ios ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artefactos Android
        uses: actions/download-artifact@v4
        with:
          name: EnduLink-Android-APK
          path: release-artifacts

      - name: Descargar artefactos iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: EnduLink-iOS-unsigned-ipa
          path: release-artifacts

      - name: Publicar Release oficial
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          body: |
            ### 🏍️ Novedades de EnduLink
            - Mejoras de rendimiento en navegación y renderizado de mapas
            - Estabilidad en la conexión Wi-Fi y transmisión con cuadro TFT
            - Correcciones menores de interfaz y compatibilidad
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

