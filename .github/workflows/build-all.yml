name: Compilar Multiplataforma (iOS & Android)

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      is_test:
        description: 'Compilar variante de test (-test en nombre y bundle ID .test)'
        required: false
        default: false
        type: boolean
      version_name:
        description: 'Versión opcional (ej. 0.3.1-test). Vacío = versión del proyecto'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

jobs:
  build-android:
    name: Compilar Android APK (Ubuntu + Gradle)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar firma Release Android desde GitHub Secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::Faltan secretos de firma Android (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/endulink-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/endulink-release.jks" >> "$GITHUB_ENV"

      - name: Compilar APK (Release)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          GRADLE_ARGS=":androidApp:assembleRelease --stacktrace"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF_NAME#v}"
            TAG_BASE="${TAG_VER%%-*}"
            IFS='.' read -r major minor patch <<< "$TAG_BASE"
            V_CODE=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
            echo "Sincronizando APK con tag $TAG_VER (code: $V_CODE)"
            GRADLE_ARGS=":androidApp:assembleRelease -PappVersionName=$TAG_VER -PappVersionCode=$V_CODE --stacktrace"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            CUSTOM_VER="${{ inputs.version_name }}"
            if [[ -n "$CUSTOM_VER" ]]; then
              TAG_BASE="${CUSTOM_VER%%-*}"
              IFS='.' read -r major minor patch <<< "$TAG_BASE"
              V_CODE=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
              GRADLE_ARGS="$GRADLE_ARGS -PappVersionName=$CUSTOM_VER -PappVersionCode=$V_CODE"
            fi
            if [[ "${{ inputs.is_test }}" == "true" ]]; then
              GRADLE_ARGS="$GRADLE_ARGS -PisTestBuild=true"
            fi
          fi
          ./gradlew $GRADLE_ARGS
          test -f androidApp/build/outputs/apk/release/androidApp-release.apk

      - name: Subir artefacto APK (Android)
        uses: actions/upload-artifact@v4
        with:
          name: EnduLink-Android-APK
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Cancelar el resto de jobs si falla
        if: failure()
        uses: andymckay/cancel-action@0.4

  build-ios:
    name: Compilar iOS IPA (macOS + Xcode)
    runs-on: macos-15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version
          xcodebuild -version

      - name: Compilar XCFramework KMP Compartido (Solo ARM64 para dispositivo)
        run: |
          chmod +x gradlew
          ./gradlew :shared:assembleSharedAppReleaseXCFramework -PiosArm64Only=true --stacktrace

      - name: Sincronizar versión e identidad iOS (Release o Test)
        run: |
          IS_TEST="false"
          TARGET_VER=""
          TARGET_CODE=""
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TARGET_VER="${GITHUB_REF_NAME#v}"
            TAG_BASE="${TARGET_VER%%-*}"
            IFS='.' read -r major minor patch <<< "$TAG_BASE"
            TARGET_CODE=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
            if [[ "$TARGET_VER" == *-* ]]; then
              IS_TEST="true"
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TARGET_VER="${{ inputs.version_name }}"
            if [[ "${{ inputs.is_test }}" == "true" || "$TARGET_VER" == *-* ]]; then
              IS_TEST="true"
            fi
            if [[ -n "$TARGET_VER" ]]; then
              TAG_BASE="${TARGET_VER%%-*}"
              IFS='.' read -r major minor patch <<< "$TAG_BASE"
              TARGET_CODE=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
            fi
          fi

          if [[ "$IS_TEST" == "true" ]]; then
            BUNDLE_ID="com.oscar.endulink.test"
            APP_NAME="motillOS-test"
          else
            BUNDLE_ID="com.oscar.endulink"
            APP_NAME="motillOS"
          fi

          echo "iOS build -> appName=$APP_NAME bundleId=$BUNDLE_ID version=${TARGET_VER:-default} code=${TARGET_CODE:-default}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $APP_NAME" iosApp/iosApp/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleName $APP_NAME" iosApp/iosApp/Info.plist
          if [[ -n "$TARGET_VER" ]]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $TARGET_VER" iosApp/iosApp/Info.plist
          fi
          if [[ -n "$TARGET_CODE" ]]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $TARGET_CODE" iosApp/iosApp/Info.plist
          fi

          TARGET_VER="$TARGET_VER" TARGET_CODE="$TARGET_CODE" BUNDLE_ID="$BUNDLE_ID" python3 -c 'import os, re; p="iosApp/project.yml"; s=open(p,encoding="utf-8").read(); s=re.sub(r"(PRODUCT_BUNDLE_IDENTIFIER:\s*).*", r"\g<1>"+os.environ["BUNDLE_ID"], s); s=re.sub(r"(MARKETING_VERSION:\s*).*", r"\g<1>\""+os.environ["TARGET_VER"]+"\"", s) if os.environ.get("TARGET_VER") else s; s=re.sub(r"(CURRENT_PROJECT_VERSION:\s*).*", r"\g<1>\""+os.environ["TARGET_CODE"]+"\"", s) if os.environ.get("TARGET_CODE") else s; open(p,"w",encoding="utf-8").write(s)'

      - name: Generar proyecto Xcode con XcodeGen
        run: |
          cd iosApp
          xcodegen generate

      - name: Compilar EnduLink (Release ARM64 sin firma)
        run: |
          xcodebuild -project iosApp/EnduLink.xcodeproj \
            -scheme EnduLink \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            -parallelizeTargets \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=""

      - name: Empaquetar EnduLink-unsigned.ipa
        run: |
          rm -rf Payload EnduLink-unsigned.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/EnduLink.app Payload/
          zip -qry EnduLink-unsigned.ipa Payload
          ls -lh EnduLink-unsigned.ipa

      - name: Subir artefacto IPA (para Sideloadly / SideStore)
        uses: actions/upload-artifact@v4
        with:
          name: EnduLink-iOS-unsigned-ipa
          path: EnduLink-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Cancelar el resto de jobs si falla
        if: failure()
        uses: andymckay/cancel-action@0.4

  release:
    name: Publicar Release en GitHub (APK + IPA)
    needs: [ build-android, build-ios ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout historial para notas dinámicas de versión
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar artefactos Android
        uses: actions/download-artifact@v4
        with:
          name: EnduLink-Android-APK
          path: release-artifacts

      - name: Descargar artefactos iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: EnduLink-iOS-unsigned-ipa
          path: release-artifacts

      - name: Generar notas de versión dinámicas
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -Fxv "$CURRENT_TAG" | head -n 1 || true)
          {
            echo "### Novedades de EnduLink / motillOS (${CURRENT_TAG})"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "Cambios desde \`${PREV_TAG}\`:"
              git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"- %s"
              echo ""
            else
              git log -n 10 --no-merges --pretty=format:"- %s"
              echo ""
            fi
          } > release_notes.md
          cat release_notes.md

      - name: Publicar Release oficial
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          body_path: release_notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

