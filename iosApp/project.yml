name: EnduLink
options:
  bundleIdPrefix: com.oscar
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.15"
    CURRENT_PROJECT_VERSION: "15"

targets:
  EnduLink:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iosApp
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oscar.endulink
        PRODUCT_NAME: EnduLink
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iosApp/Info.plist
        ENABLE_BITCODE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        FRAMEWORK_SEARCH_PATHS:
          - "$(SRCROOT)/../shared/build/XCFrameworks/release"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-ObjC"
    dependencies:
      - framework: ../shared/build/XCFrameworks/release/SharedApp.xcframework
        embed: false
      - sdk: CoreLocation.framework
      - sdk: MapKit.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: AVFoundation.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: SwiftUI.framework

schemes:
  EnduLink:
    build:
      targets:
        EnduLink: all
    run:
      config: Release
    archive:
      config: Release

